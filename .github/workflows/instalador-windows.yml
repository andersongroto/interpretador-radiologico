name: Instalador Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write  # necessário apenas para publicar a release em tags v*

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências (PyTorch para CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ".[dev,desktop,empacotamento]"

      - name: Testes
        run: pytest -q -p no:cacheprovider

      - name: Preparar recursos embutidos (pesos e exame de exemplo)
        run: |
          interpretador-radiologico baixar-modelos --pesos empacotamento/recursos/pesos
          interpretador-radiologico exemplo -o empacotamento/recursos

      - name: Gerar executável (PyInstaller)
        run: pyinstaller empacotamento/interpretador.spec --noconfirm --distpath dist --workpath build

      - name: Autoteste do executável
        shell: pwsh
        run: |
          $saida = Join-Path $env:RUNNER_TEMP "autoteste"
          $p = Start-Process -FilePath "dist\InterpretadorRadiologico\InterpretadorRadiologico.exe" `
                 -ArgumentList "--autoteste", "`"$saida`"" -Wait -PassThru
          $log = Join-Path $env:APPDATA "InterpretadorRadiologico\registros\aplicativo.log"
          if (Test-Path $log) { Get-Content $log -Tail 80 }
          if ($p.ExitCode -ne 0) { Write-Error "Autoteste falhou (código $($p.ExitCode))"; exit 1 }
          Get-Content (Join-Path $saida "autoteste.txt")
          Get-ChildItem $saida

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $versao = python -c "import interpretador_radiologico as m; print(m.__version__)"
          & $iscc "/DVersaoApp=$versao" empacotamento\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
          compression-level: 0
          retention-days: 30

      - name: Publicar release (apenas tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
